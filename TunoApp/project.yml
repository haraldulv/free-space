name: Tuno
options:
  bundleIdPrefix: no.tuno
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

# To build-configs per environment. Debug/Release for prod, Debug-Staging/
# Release-Staging for staging-build (peker mot staging-Supabase + Stripe-test).
# Per-config-overrides settes på targets.Tuno.settings.configs.<config> nedenfor.
configs:
  Debug: debug
  Release: release
  Debug-Staging: debug
  Release-Staging: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3VD2DMBJ6M
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 186

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk.git
    from: "9.0.0"
  GooglePlaces:
    url: https://github.com/googlemaps/ios-places-sdk.git
    from: "10.0.0"
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm.git
    from: "24.0.0"
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: "4.5.0"

schemes:
  Tuno:
    build:
      targets:
        Tuno: all
    run:
      config: Debug
      disableMainThreadChecker: true
      diagnosticOptions:
        mainThreadChecker: false
    archive:
      config: Release
  Tuno-Staging:
    build:
      targets:
        Tuno: all
    run:
      config: Debug-Staging
      disableMainThreadChecker: true
      diagnosticOptions:
        mainThreadChecker: false
    archive:
      config: Release-Staging

targets:
  Tuno:
    type: application
    platform: iOS
    sources:
      - path: Tuno
        excludes:
          - "Resources/**/README.md"
    # Entitlements-filer (Tuno.entitlements + Tuno-Staging.entitlements)
    # er hand-skrevne og pekes til via CODE_SIGN_ENTITLEMENTS per config
    # nedenfor. Vi lar IKKE xcodegen generere/overskrive dem.
    settings:
      base:
        INFOPLIST_FILE: Tuno/Info.plist
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: no.tuno.app
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          CODE_SIGN_ENTITLEMENTS: Tuno/Tuno.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: no.tuno.app
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          CODE_SIGN_ENTITLEMENTS: Tuno/Tuno.entitlements
        Debug-Staging:
          PRODUCT_BUNDLE_IDENTIFIER: no.tuno.app.staging
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Staging
          CODE_SIGN_ENTITLEMENTS: Tuno/Tuno-Staging.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING DEBUG
        Release-Staging:
          PRODUCT_BUNDLE_IDENTIFIER: no.tuno.app.staging
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Staging
          CODE_SIGN_ENTITLEMENTS: Tuno/Tuno-Staging.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleMaps
        product: GoogleMaps
      - package: GooglePlaces
        product: GooglePlaces
      - package: Stripe
        product: StripeApplePay
      - package: Stripe
        product: StripePaymentsUI
      - package: Lottie
        product: Lottie
    info:
      path: Tuno/Info.plist
      properties:
        CFBundleDisplayName: Tuno
        CFBundleName: Tuno
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: nb
        CFBundleLocalizations:
          - nb
          - en
          - de
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Tuno trenger tilgang til posisjonen din for å vise parkerings- og campingplasser i nærheten."
        NSCameraUsageDescription: "Tuno bruker kameraet til å ta bilder av legitimasjon under Stripe-onboarding for utleiere."
        NSPhotoLibraryUsageDescription: "Tuno trenger tilgang til bildebiblioteket ditt for å laste opp profilbilde og bilder av plassene dine."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - no.tuno.app
            CFBundleURLName: no.tuno.app
